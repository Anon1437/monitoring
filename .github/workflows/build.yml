name: Build APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 🔥 1. Debug APK Build karein
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 🔥 2. Release APK Build karein (Unsigned)
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 🔥 3. Dono APKs ko Upload karein
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          
